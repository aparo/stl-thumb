name: Build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-buildtest-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install libosmesa6-dev xvfb
    - name: Build
      run: |
        cargo build --release --verbose
        strip -s target/release/stl-thumb
    - name: Run tests
      run: RUST_BACKTRACE=1 xvfb-run cargo test --verbose

  package-linux:
    needs: [build]
    name: Package Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install libosmesa6-dev libfreetype6-dev libfontconfig-dev
    - name: Install packaging tools
      run: |
        cargo install cargo-deb --force
        cargo install cargo-generate-rpm --force
    - name: Package DEB
      run: cargo deb
    - name: Package RPM
      run: |
        cargo build --release
        cargo generate-rpm
    - uses: actions/upload-artifact@v4
      with:
        name: linux-amd64-packages
        path: |
          target/debian/*.deb
          target/generate-rpm/*.rpm

  package-windows:
    needs: [build]
    name: Package Windows (x64)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-windows-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --release --verbose
    - uses: actions/upload-artifact@v4
      with:
        name: windows-x64
        path: target/release/stl-thumb.exe
